# Image qui inclut les versions de Java et Maven dont on a besoin
image: maven:3.9-eclipse-temurin-21

# Paramètres proxy pour les requetes
before_script:
  - echo "Configuration du proxy Maven..."
  - mkdir -p ~/.m2
  - |
    echo '<settings>
      <proxies>
        <proxy>
          <id>gitlab-proxy-http</id>
          <active>true</active>
          <protocol>http</protocol>
          <host>194.254.199.96</host>
          <port>3128</port>
        </proxy>
        <proxy>
          <id>gitlab-proxy-https</id>
          <active>true</active>
          <protocol>https</protocol>
          <host>194.254.199.96</host>
          <port>3128</port>
        </proxy>
      </proxies>
    </settings>' > ~/.m2/settings.xml
  - echo "Fichier settings.xml créé."


stages:
  - build
  - test
  - package

# Compilation du code source Java
build-job:
  stage: build
  script:
    - echo "Compilation du code..."
    - mvn compile

# Test unitaires avec JUnit
unit-test-job:
  stage: test
  script:
    - echo "Lancement des tests unitaires (JUnit)..."
    - mvn test

# Création du fichier .jar exécutable
package-job:
  stage: package
  script:
    - echo "Création du fichier .jar exécutable..."
    - mvn package
  artifacts:
    paths:
      # Sauvegarde du fichier .jar créé
      - target/*.jar
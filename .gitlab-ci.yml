# Image qui inclut les versions de Java et Maven dont on a besoin
image: maven:3.9-eclipse-temurin-21

# Le cache va garder les fichiers compilés pour les autres tests
cache:
  paths:
    - .m2/repository

# Paramètres proxy pour les requetes
before_script:
  - echo "Configuration du proxy Maven..."
  - mkdir -p ~/.m2
  - |
    echo '<settings>
      <proxies>
        <proxy>
          <id>gitlab-proxy-http</id>
          <active>true</active>
          <protocol>http</protocol>
          <host>194.254.199.96</host>
          <port>3128</port>
        </proxy>
        <proxy>
          <id>gitlab-proxy-https</id>
          <active>true</active>
          <protocol>https</protocol>
          <host>194.254.199.96</host>
          <port>3128</port>
        </proxy>
      </proxies>
    </settings>' > ~/.m2/settings.xml
  - echo "Fichier settings.xml créé."


variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

stages:
  - prepare   # "Prépare" les fichiers pour éviter de les retélecharger à chaque job
  - build
  - test
  - package


# Remplit le cache pour les autres jobs
download-dependencies-job:
  stage: prepare
  script:
    - echo "Téléchargement de TOUTES les dépendances..."
    - mvn dependency:go-offline


build-job:
  stage: build
  script:
    - echo "Compilation du code (cache utilisé)..."
    - mvn compile

unit-test-job:
  stage: test
  script:
    - echo "Lancement des tests unitaires (cache utilisé)..."
    - mvn test

package-job:
  stage: package
  script:
    - echo "Création du fichier .jar (cache utilisé)..."
    - mvn package
  artifacts:
    paths:
      - target/Worms-1.0-SNAPSHOT.jar
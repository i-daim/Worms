# Image qui inclut les versions de Java et Maven dont on a besoin
image: maven:3.9-eclipse-temurin-21

# Paramètres proxy pour les requetes
before_script:
  - echo "Configuration du proxy Maven..."
  - mkdir -p ~/.m2
  - |
    echo '<settings>
      <proxies>
        <proxy>
          <id>gitlab-proxy-http</id>
          <active>true</active>
          <protocol>http</protocol>
          <host>194.254.199.96</host>
          <port>3128</port>
        </proxy>
        <proxy>
          <id>gitlab-proxy-https</id>
          <active>true</active>
          <protocol>https</protocol>
          <host>194.254.199.96</host>
          <port>3128</port>
        </proxy>
      </proxies>
    </settings>' > ~/.m2/settings.xml


stages:
  - build-and-test

build-and-test-job:
  stage: build-and-test
  script:
    - echo "Exécution du build (compile, checkstyle, test, package)..."
    - mvn verify
  artifacts:
    paths:
      - target/Worms.jar
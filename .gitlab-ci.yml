# Image qui inclut les versions de Java et Maven dont on a besoin
image: maven:3.9-eclipse-temurin-21

# Paramètres proxy pour les requetes
before_script:
  - echo "Configuration du proxy Maven..."
  - mkdir -p ~/.m2
  - |
    echo '<settings>
      <proxies>
        <proxy>
          <id>gitlab-proxy-http</id>
          <active>true</active>
          <protocol>http</protocol>
          <host>194.254.199.96</host>
          <port>3128</port>
        </proxy>
        <proxy>
          <id>gitlab-proxy-https</id>
          <active>true</active>
          <protocol>https</protocol>
          <host>194.254.199.96</host>
          <port>3128</port>
        </proxy>
      </proxies>
    </settings>' > ~/.m2/settings.xml


stages:
  - build-and-test
  - package

# Exécute la compilation, les tests et la vérification de la syntaxe
build-and-test-job:
  stage: build-and-test
  script:
    - echo "Exécution de la vérification (compile, checkstyle, test)..."
    - mvn compile test checkstyle:check


# Fournit le fichier .jar compilé
package-job:
  stage: package
  script:
    - echo "Exécution du packaging..."
    - mvn package

  artifacts:
    paths:
      - target/Glorb26-1.0.jar

  # S'exécute seulement pour les tags
  rules:
    - if: $CI_COMMIT_TAG
      when: always
      artifacts:
        expire_in: never

    - when: never
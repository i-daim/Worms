image: maven:3.9-eclipse-temurin-21

cache:
  paths:
    - .m2/repository

# 1. On garde le before_script pour le PROXY (on sait que ça marche)
before_script:
  - echo "Configuration du proxy Maven..."
  - mkdir -p ~/.m2
  - |
    echo '<settings>
      <proxies>
        <proxy>
          <id>gitlab-proxy-http</id>
          <active>true</active>
          <protocol>http</protocol>
          <host>194.254.199.96</host>
          <port>3128</port>
        </proxy>
        <proxy>
          <id>gitlab-proxy-https</id>
          <active>true</active>
          <protocol>https</protocol>
          <host>194.254.199.96</host>
          <port>3128</port>
        </proxy>
      </proxies>
    </settings>' > ~/.m2/settings.xml
  - echo "Fichier settings.xml créé."

# 2. On garde MAVEN_OPTS pour le CACHE (on sait que c'est nécessaire)
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

# 3. ON AJOUTE UN NOUVEAU "STAGE" AU DÉBUT
stages:
  - prepare   # <--- NOUVEAU
  - build
  - test
  - package

# 4. ON AJOUTE UN JOB QUI REMPLIT LE CACHE
download-dependencies-job:
  stage: prepare
  script:
    - echo "Téléchargement de TOUTES les dépendances..."
    # Cette commande télécharge tout (compile, test, etc.)
    - mvn dependency:go-offline

# 5. LES AUTRES JOBS (qui maintenant utiliseront le cache complet)
build-job:
  stage: build
  script:
    - echo "Compilation du code (cache utilisé)..."
    - mvn compile

unit-test-job:
  stage: test
  script:
    - echo "Lancement des tests unitaires (cache utilisé)..."
    - mvn test

package-job:
  stage: package
  script:
    - echo "Création du fichier .jar (cache utilisé)..."
    - mvn package
  artifacts:
    paths:
      - target/Worms-1.0-SNAPSHOT.jar
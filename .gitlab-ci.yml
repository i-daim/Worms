# Image qui inclut les versions de Java et Maven dont on a besoin
image: maven:3.9-eclipse-temurin-21

# Paramètres proxy pour les requetes
variables:
  HTTPS_PROXY: "http://194.254.199.96:3128"
  HTTP_PROXY: "http://194.254.199.96:3128"


stages:
  - build
  - test
  - package

# Compilation du code source Java
build-job:
  stage: build
  script:
    - echo "Compilation du code..."
    - mvn compile

# Test unitaires avec JUnit
unit-test-job:
  stage: test
  script:
    - echo "Lancement des tests unitaires (JUnit)..."
    - mvn test

# Création du fichier .jar exécutable
package-job:
  stage: package
  script:
    - echo "Création du fichier .jar exécutable..."
    - mvn package
  artifacts:
    paths:
      # Sauvegarde du fichier .jar créé
      - target/*.jar